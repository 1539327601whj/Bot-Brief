services:
  backend:
    image: ${BACKEND_IMAGE:-bot-brief-backend:local}
    build:
      context: ./backend
    container_name: bot-brief-backend
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8081"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-168}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@example.com}
      DEMO_DISPLAY_NAME: ${DEMO_DISPLAY_NAME:-公开演示账号}
      DEMO_TOKEN_EXPIRATION_MINUTES: ${DEMO_TOKEN_EXPIRATION_MINUTES:-30}
      REPORT_INGEST_TOKEN: ${REPORT_INGEST_TOKEN}
      REPORT_GENERATION_LEAD_MINUTES: ${REPORT_GENERATION_LEAD_MINUTES:-30}
      PUSH_CHANNEL_ENCRYPTION_KEY: ${PUSH_CHANNEL_ENCRYPTION_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BriefMind}
      # 日志：容器里固定 UTF-8（服务器要确定值，不跟随宿主终端）；落盘到 /app/logs，
      # 也固定 UTF-8，按天滚动。
      # 本地用 docker compose logs 看、而终端按 GBK 解码时，在 .env 里设 LOG_CONSOLE_CHARSET=GBK。
      # 注意本地直接跑（不走 compose）时不用设：不设就自动跟随终端编码。
      LOG_CONSOLE_CHARSET: ${LOG_CONSOLE_CHARSET:-UTF-8}
      LOG_FILE_NAME: /app/logs/app.log
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      # 想看 SQL 就设 DEBUG
      LOG_SQL_LEVEL: ${LOG_SQL_LEVEL:-INFO}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-14}
    volumes:
      - ./logs/backend:/app/logs
    restart: always

  poller:
    image: ${POLLER_IMAGE:-bot-brief-poller:local}
    build:
      context: ./automation
    container_name: bot-brief-poller
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      MODE: poll
      BACKEND_API_URL: ${POLLER_BACKEND_URL:-http://backend:8081}
      REPORT_INGEST_TOKEN: ${REPORT_INGEST_TOKEN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-4}
      PYTHONIOENCODING: UTF-8
      LOG_LEVEL: ${POLLER_LOG_LEVEL:-INFO}
      LOG_FILE_DIR: /app/logs
    volumes:
      - ./logs/poller:/app/logs
    restart: always

  # 数据仓库：与 poller 共用镜像，但独立进程、独立 DB 凭据、独立重启。
  # poller 仍然不拿 DB 凭据；DB 只授 md_* 的 SELECT/INSERT/UPDATE。
  warehouse:
    image: ${POLLER_IMAGE:-bot-brief-poller:local}
    build:
      context: ./automation
    container_name: bot-brief-warehouse
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      # 生产环境必须给独立的只写 md_* 账号；不配就退回应用账号并打 WARN。
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-}
      BACKEND_API_URL: ${POLLER_BACKEND_URL:-http://backend:8081}
      REPORT_INGEST_TOKEN: ${REPORT_INGEST_TOKEN}
      # 国内行情域名不走系统代理；容器里也没有代理。
      WAREHOUSE_TRUST_ENV: "false"
      WAREHOUSE_BATCH_START_HOUR: ${WAREHOUSE_BATCH_START_HOUR:-17}
      WAREHOUSE_UNIVERSE_SIZE: ${WAREHOUSE_UNIVERSE_SIZE:-3000}
      WAREHOUSE_NEWS_REFRESH_ENABLED: ${WAREHOUSE_NEWS_REFRESH_ENABLED:-false}
      WAREHOUSE_JOB_POLL_SECONDS: ${WAREHOUSE_JOB_POLL_SECONDS:-2.0}
      LOG_LEVEL: ${WAREHOUSE_LOG_LEVEL:-INFO}
      PYTHONIOENCODING: UTF-8
    volumes:
      - ./logs/warehouse:/app/logs
    # 镜像默认 CMD 是 poller，这里必须显式覆盖。
    command: ["python", "-u", "warehouse_worker.py"]
    # 缺表/缺列或数据库不可达都会退出 2，容器标记为 unhealthy（便于部署脚本发现）。
    healthcheck:
      test: ["CMD", "python", "scripts/verify_warehouse_schema.py", "--manifest", "--json", "--connect-timeout", "3"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: always

  frontend:
    image: ${FRONTEND_IMAGE:-bot-brief-frontend:local}
    build:
      context: ./frontend
    container_name: bot-brief-frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: always
