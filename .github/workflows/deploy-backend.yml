name: Deploy Backend

# 海外托管 runner 跨境传包，仅作应急手动备份。日常请用 Deploy on server。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署的分支'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: bot-brief-server-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/Bot-Brief
  IMAGE_REPOSITORY: bot-brief-backend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Package backend source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          archive="backend-source-${short_sha}.tar.gz"
          tar -czf "$RUNNER_TEMP/$archive" \
            backend/pom.xml \
            backend/src \
            backend/Dockerfile \
            backend/.dockerignore \
            automation/Dockerfile \
            automation/.dockerignore \
            automation/requirements.txt \
            automation/poll_loop.py \
            automation/scripts/daily_report.py \
            docker-compose.yml
          (cd "$RUNNER_TEMP" && sha256sum "$archive" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Configure deployment SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY" || { echo "SERVER_SSH_KEY is not configured"; exit 1; }
          test -n "$SERVER_HOST_KEY" || { echo "SERVER_HOST_KEY is not configured"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SERVER_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Prepare backend environment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_HOURS: ${{ secrets.JWT_EXPIRATION_HOURS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DEMO_ENABLED: ${{ vars.DEMO_ENABLED || 'false' }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL || 'demo@example.com' }}
          DEMO_DISPLAY_NAME: ${{ vars.DEMO_DISPLAY_NAME || '公开演示账号' }}
          DEMO_TOKEN_EXPIRATION_MINUTES: ${{ vars.DEMO_TOKEN_EXPIRATION_MINUTES || '30' }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
          PUSH_CHANNEL_ENCRYPTION_KEY: ${{ secrets.PUSH_CHANNEL_ENCRYPTION_KEY }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : > "$RUNNER_TEMP/backend.env"
          for name in DEEPSEEK_API_KEY DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD JWT_SECRET JWT_EXPIRATION_HOURS ADMIN_EMAIL ADMIN_PASSWORD DEMO_ENABLED DEMO_EMAIL DEMO_DISPLAY_NAME DEMO_TOKEN_EXPIRATION_MINUTES REPORT_INGEST_TOKEN PUSH_CHANNEL_ENCRYPTION_KEY MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_FROM_NAME; do
            value="${!name}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must not contain line breaks"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> "$RUNNER_TEMP/backend.env"
          done

      - name: Upload backend release
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$DEPLOY_DIR/.deploy/backend-$RELEASE_SHA"
          archive_path="$RUNNER_TEMP/$ARCHIVE"
          archive_bytes="$(stat -c '%s' "$archive_path")"
          archive_sha="$(cut -d ' ' -f 1 "$RUNNER_TEMP/$ARCHIVE.sha256")"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          echo "Backend release archive: $(numfmt --to=iec "$archive_bytes") ($archive_bytes bytes)"
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_DIR='$DEPLOY_DIR' RELEASE_SHA='$RELEASE_SHA' ARCHIVE='$ARCHIVE' ARCHIVE_SHA='$archive_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 "$DEPLOY_DIR/.deploy"
          release_dir="$DEPLOY_DIR/.deploy/backend-$RELEASE_SHA"
          install -d -m 700 "$release_dir"
          find "$DEPLOY_DIR/.deploy" -mindepth 1 -maxdepth 1 -type d -mmin +1440 ! -path "$release_dir" -exec rm -rf -- {} +
          if [ "$(cat "$release_dir/.archive-sha256" 2>/dev/null || true)" != "$ARCHIVE_SHA" ]; then
            rm -f "$release_dir/$ARCHIVE"
          fi
          printf '%s\n' "$ARCHIVE_SHA" > "$release_dir/.archive-sha256"
          REMOTE

          for attempt in 1 2; do
            echo "Uploading backend source ($attempt/2)"
            if timeout 90s scp "${ssh_opts[@]}" \
              "$archive_path" \
              "$RUNNER_TEMP/$ARCHIVE.sha256" \
              "$RUNNER_TEMP/backend.env" \
              "$SERVER_USER@$SERVER_IP:$release_dir/"; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              echo "Backend source upload failed after 2 attempts"
              exit 1
            fi
            echo "Backend source upload interrupted, retrying in 10s"
            sleep 10
          done

      - name: Activate backend release
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE_TAG: ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.sha }}
          POLLER_TAG: bot-brief-poller:${{ steps.release.outputs.sha }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_DIR='$DEPLOY_DIR' IMAGE_TAG='$IMAGE_TAG' POLLER_TAG='$POLLER_TAG' ARCHIVE='$ARCHIVE' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="$DEPLOY_DIR/.deploy/backend-$RELEASE_SHA"
          cd "$release_dir"
          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed on the server"; exit 1; }
          docker compose version >/dev/null
          if ! sha256sum -c "$ARCHIVE.sha256"; then
            rm -f "$ARCHIVE" .archive-sha256
            echo "Backend archive checksum failed; the next run will upload it again"
            exit 1
          fi
          tar -xzf "$ARCHIVE"
          test -f backend/Dockerfile || { echo "Backend Dockerfile is missing from the source archive"; exit 1; }
          test -f automation/Dockerfile || { echo "Poller Dockerfile is missing from the source archive"; exit 1; }
          docker build -t "$IMAGE_TAG" backend
          docker build -t "$POLLER_TAG" automation

          previous_image="$(docker inspect --format '{{.Config.Image}}' bot-brief-backend 2>/dev/null || true)"
          previous_poller="$(docker inspect --format '{{.Config.Image}}' bot-brief-poller 2>/dev/null || true)"
          docker image inspect mysql:8.0 >/dev/null 2>&1 || { docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true; echo "mysql:8.0 image must be preloaded on the server for schema checks"; exit 1; }
          schema_ready=$(docker run --rm --pull=never \
            --add-host=host.docker.internal:host-gateway \
            -e MYSQL_PWD="$(awk -F= '$1 == "DB_PASSWORD" {sub(/^[^=]*=/, ""); print; exit}' backend.env)" \
            mysql:8.0 \
            mysql -N \
            -h "$(awk -F= '$1 == "DB_HOST" {print $2; exit}' backend.env)" \
            -P "$(awk -F= '$1 == "DB_PORT" {print $2; exit}' backend.env)" \
            -u "$(awk -F= '$1 == "DB_USER" {print $2; exit}' backend.env)" \
            "$(awk -F= '$1 == "DB_NAME" {print $2; exit}' backend.env)" \
            -e "SELECT COUNT(*) = 1 FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'topic_sections' UNION ALL SELECT COUNT(*) = 1 FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'reports' AND column_name = 'user_id' UNION ALL SELECT COUNT(*) = 1 FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'reports' AND column_name = 'display_time' UNION ALL SELECT COUNT(*) = 1 FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'ops_heartbeat' UNION ALL SELECT COUNT(*) = 1 FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'topic_generation_status';")
          if [ "$(printf '%s\n' "$schema_ready" | tr -d '\r' | sort -u)" != "1" ]; then
            docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
            echo "Database schema is missing V10/V11/V12. Back up the database and run backend/sql/V10__topic_sections_and_user_reports.sql, backend/sql/V11__topic_windows_and_display_time.sql, then backend/sql/V12__ops_heartbeat_and_generation_status.sql before deployment."
            exit 1
          fi

          had_previous_env=false
          had_previous_compose=false
          if [ -f "$DEPLOY_DIR/.env.deploy" ]; then
            cp -p "$DEPLOY_DIR/.env.deploy" "$release_dir/.env.deploy.previous"
            had_previous_env=true
          fi
          if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
            cp -p "$DEPLOY_DIR/docker-compose.yml" "$release_dir/docker-compose.yml.previous"
            had_previous_compose=true
          fi
          install -m 600 backend.env "$DEPLOY_DIR/.env.deploy.new"
          mv -f "$DEPLOY_DIR/.env.deploy.new" "$DEPLOY_DIR/.env.deploy"
          install -m 644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml.new"
          mv -f "$DEPLOY_DIR/docker-compose.yml.new" "$DEPLOY_DIR/docker-compose.yml"
          cd "$DEPLOY_DIR"

          BACKEND_IMAGE="$IMAGE_TAG" POLLER_IMAGE="$POLLER_TAG" docker compose --env-file .env.deploy up -d --no-build --force-recreate backend poller
          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8081/api/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          poller_running="$(docker inspect -f '{{.State.Running}}' bot-brief-poller 2>/dev/null || true)"

          if [ "$healthy" != "true" ] || [ "$poller_running" != "true" ]; then
            echo "Backend or poller health check failed"
            docker logs --tail 200 bot-brief-backend || true
            docker logs --tail 200 bot-brief-poller || true
            if [ "$had_previous_env" = "true" ]; then
              install -m 600 "$release_dir/.env.deploy.previous" "$DEPLOY_DIR/.env.deploy"
            fi
            if [ "$had_previous_compose" = "true" ]; then
              install -m 644 "$release_dir/docker-compose.yml.previous" "$DEPLOY_DIR/docker-compose.yml"
            fi
            if [ -n "$previous_image" ] && docker image inspect "$previous_image" >/dev/null 2>&1; then
              echo "Rolling back to $previous_image"
              if [ -n "$previous_poller" ] && docker image inspect "$previous_poller" >/dev/null 2>&1; then
                BACKEND_IMAGE="$previous_image" POLLER_IMAGE="$previous_poller" docker compose --env-file .env.deploy up -d --no-build --force-recreate backend poller
              else
                BACKEND_IMAGE="$previous_image" docker compose --env-file .env.deploy up -d --no-build --force-recreate backend
              fi
            fi
            docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
            docker image rm "$POLLER_TAG" >/dev/null 2>&1 || true
            exit 1
          fi

          if [ -n "$previous_image" ] && [ "$previous_image" != "$IMAGE_TAG" ] && docker image inspect "$previous_image" >/dev/null 2>&1; then
            docker tag "$previous_image" bot-brief-backend:previous
          else
            docker image rm bot-brief-backend:previous >/dev/null 2>&1 || true
          fi
          if [ -n "$previous_poller" ] && [ "$previous_poller" != "$POLLER_TAG" ] && docker image inspect "$previous_poller" >/dev/null 2>&1; then
            docker tag "$previous_poller" bot-brief-poller:previous
          else
            docker image rm bot-brief-poller:previous >/dev/null 2>&1 || true
          fi
          docker tag "$IMAGE_TAG" bot-brief-backend:local
          docker tag "$POLLER_TAG" bot-brief-poller:local
          current_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          previous_id="$(docker image inspect --format '{{.Id}}' bot-brief-backend:previous 2>/dev/null || true)"
          while IFS= read -r old_image; do
            [ -n "$old_image" ] || continue
            old_id="$(docker image inspect --format '{{.Id}}' "$old_image" 2>/dev/null || true)"
            if [ "$old_id" != "$current_id" ] && [ "$old_id" != "$previous_id" ]; then
              docker image rm "$old_image" >/dev/null 2>&1 || true
            fi
          done < <(docker image ls bot-brief-backend --format '{{.Repository}}:{{.Tag}}' | grep -E '^bot-brief-backend:[0-9a-f]{12,}$' || true)
          poller_current_id="$(docker image inspect --format '{{.Id}}' "$POLLER_TAG")"
          poller_previous_id="$(docker image inspect --format '{{.Id}}' bot-brief-poller:previous 2>/dev/null || true)"
          while IFS= read -r old_image; do
            [ -n "$old_image" ] || continue
            old_id="$(docker image inspect --format '{{.Id}}' "$old_image" 2>/dev/null || true)"
            if [ "$old_id" != "$poller_current_id" ] && [ "$old_id" != "$poller_previous_id" ]; then
              docker image rm "$old_image" >/dev/null 2>&1 || true
            fi
          done < <(docker image ls bot-brief-poller --format '{{.Repository}}:{{.Tag}}' | grep -E '^bot-brief-poller:[0-9a-f]{12,}$' || true)
          rm -rf "$release_dir"
          docker image prune -f
          echo "Backend deployed successfully: $IMAGE_TAG"
          echo "Poller deployed successfully: $POLLER_TAG"
          REMOTE
