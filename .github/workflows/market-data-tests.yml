name: 市场数据链路测试

on:
  pull_request:
    paths:
      - 'automation/**'
      - 'backend/**'
      - '.github/workflows/etf-daily.yml'
      - '.github/workflows/market-data-tests.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'automation/**'
      - 'backend/**'
      - '.github/workflows/etf-daily.yml'
      - '.github/workflows/market-data-tests.yml'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt
      - run: pip install -r automation/requirements.txt -q
      - run: python -m unittest discover -s automation/tests -p "test_*.py" -v

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - run: mvn -f backend/pom.xml test
