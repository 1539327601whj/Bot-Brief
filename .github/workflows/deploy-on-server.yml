name: Deploy on server

# 在腾讯云上的 self-hosted runner 里构建并发布，避免 GitHub 托管 runner 跨境传包。
# 服务器装好 runner 并打上 label `bot-brief` 后才会执行。
on:
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        type: choice
        default: frontend
        options:
          - frontend
          - backend
          - all
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'scripts/release-frontend.sh'
      - '.github/workflows/deploy-on-server.yml'

concurrency:
  group: bot-brief-server-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'frontend' || inputs.target == 'all') ||
      github.event_name == 'push'
    runs-on: [self-hosted, linux, bot-brief]
    steps:
      - name: Checkout via GitHub proxy
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # gh-proxy 对 git 协议经常 404；和当初下 runner 一样，改下源码包。
          # 不要把 token 写进 URL，否则代理会当成无效地址。
          candidates=(
            "https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
            "https://gh-proxy.com/https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}"
            "https://ghfast.top/https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
            "https://ui.ghproxy.cc/https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
            "https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/${GITHUB_REF_NAME:-main}.tar.gz"
          )

          archive="$tmp/src.tar.gz"
          downloaded=false
          for url in "${candidates[@]}"; do
            echo "Downloading source archive"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 180 -o "$archive" "$url"; then
              if tar -tzf "$archive" >/dev/null 2>&1; then
                downloaded=true
                break
              fi
            fi
            rm -f "$archive"
          done
          if [ "$downloaded" != "true" ]; then
            echo "Could not download the repository archive via proxy"
            exit 1
          fi

          tar -xzf "$archive" -C "$tmp"
          extracted="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$extracted"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "$extracted"/. "$GITHUB_WORKSPACE/"
          test -f scripts/release-frontend.sh

      - name: Release frontend on this machine
        env:
          DEPLOY_DIR: /opt/Bot-Brief
        run: |
          set -euo pipefail
          chmod +x scripts/release-frontend.sh
          ./scripts/release-frontend.sh
