name: 市场观察

on:
  # 定时由腾讯云 SCF 负责，避免 GitHub schedule 延迟或重复推送
  workflow_dispatch:
    inputs:
      edition:
        description: '选择版本'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
      sync_only:
        description: '仅回填并校验 ETF 价格历史，不推送日报'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt
      - name: 安装依赖
        run: pip install -r automation/requirements.txt -q
      - name: 生成市场观察 & 推送
        env:
          TZ: 'Asia/Shanghai'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ETF_WECHAT_WEBHOOK: ${{ secrets.ETF_WECHAT_WEBHOOK }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
          EDITION: ${{ github.event.inputs.edition || 'auto' }}
          ETF_SYNC_ONLY: ${{ github.event.inputs.sync_only || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python automation/scripts/etf_report.py
