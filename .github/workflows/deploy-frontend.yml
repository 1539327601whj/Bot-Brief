name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署的分支'
        required: true
        default: 'main'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read

concurrency:
  group: bot-brief-server-deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/Bot-Brief
  IMAGE_REPOSITORY: bot-brief-frontend

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Build deployment image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          image_tag="${IMAGE_REPOSITORY}:${short_sha}"
          archive="frontend-${short_sha}.tar.gz"
          docker build --pull -t "$image_tag" frontend
          docker save "$image_tag" | gzip -9 > "$RUNNER_TEMP/$archive"
          (cd "$RUNNER_TEMP" && sha256sum "$archive" > "$archive.sha256")
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Configure deployment SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_SSH_KEY" || { echo "SERVER_SSH_KEY is not configured"; exit 1; }
          test -n "$SERVER_HOST_KEY" || { echo "SERVER_HOST_KEY is not configured"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SERVER_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Upload frontend release
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          ARCHIVE: ${{ steps.image.outputs.archive }}
          RELEASE_SHA: ${{ steps.image.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$DEPLOY_DIR/.deploy/frontend-$RELEASE_SHA"
          archive_path="$RUNNER_TEMP/$ARCHIVE"
          archive_bytes="$(stat -c '%s' "$archive_path")"
          archive_sha="$(cut -d ' ' -f 1 "$RUNNER_TEMP/$ARCHIVE.sha256")"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          echo "Frontend release archive: $(numfmt --to=iec "$archive_bytes") ($archive_bytes bytes)"
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_DIR='$DEPLOY_DIR' RELEASE_SHA='$RELEASE_SHA' ARCHIVE='$ARCHIVE' ARCHIVE_SHA='$archive_sha' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 755 "$DEPLOY_DIR"
          install -d -m 700 "$DEPLOY_DIR/.deploy"
          release_dir="$DEPLOY_DIR/.deploy/frontend-$RELEASE_SHA"
          install -d -m 700 "$release_dir"
          test -d "$release_dir"
          find "$DEPLOY_DIR/.deploy" -mindepth 1 -maxdepth 1 -type d -mmin +1440 ! -path "$release_dir" -exec rm -rf -- {} +
          if [ "$(cat "$release_dir/.archive-sha256" 2>/dev/null || true)" != "$ARCHIVE_SHA" ]; then
            rm -f "$release_dir/$ARCHIVE"
          fi
          printf '%s\n' "$ARCHIVE_SHA" > "$release_dir/.archive-sha256"
          echo "Prepared $release_dir"
          REMOTE

          remote_size() {
            ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_IP" \
              "stat -c '%s' '$release_dir/$ARCHIVE' 2>/dev/null || printf '0'" || printf '0'
          }

          write_sftp_batch() {
            local resume_flag="$1"
            {
              echo "-mkdir $DEPLOY_DIR"
              echo "-mkdir $DEPLOY_DIR/.deploy"
              echo "-mkdir $release_dir"
              if [ "$resume_flag" = "1" ]; then
                echo "reput $archive_path $release_dir/$ARCHIVE"
              else
                echo "put $archive_path $release_dir/$ARCHIVE"
              fi
              echo "put $RUNNER_TEMP/$ARCHIVE.sha256 $release_dir/$ARCHIVE.sha256"
              echo "put docker-compose.yml $release_dir/docker-compose.yml"
            } > "$batch_file"
          }

          batch_file="$RUNNER_TEMP/frontend-sftp.batch"
          for attempt in 1 2 3; do
            uploaded_bytes="$(remote_size)"
            if [[ "$uploaded_bytes" =~ ^[0-9]+$ ]] && [ "$uploaded_bytes" -gt 0 ] && [ "$uploaded_bytes" -lt "$archive_bytes" ]; then
              resume=1
              echo "Resuming frontend upload from $(numfmt --to=iec "$uploaded_bytes")"
            else
              resume=0
              echo "Uploading frontend release ($attempt/3)"
            fi
            write_sftp_batch "$resume"
            sftp "${ssh_opts[@]}" -b "$batch_file" "$SERVER_USER@$SERVER_IP" &
            upload_pid=$!
            while kill -0 "$upload_pid" 2>/dev/null; do
              uploaded_bytes="$(remote_size)"
              if [[ "$uploaded_bytes" =~ ^[0-9]+$ ]]; then
                percent=$((uploaded_bytes * 100 / archive_bytes))
                [ "$percent" -le 100 ] || percent=100
                echo "Uploaded $(numfmt --to=iec "$uploaded_bytes") / $(numfmt --to=iec "$archive_bytes") (${percent}%)"
              fi
              sleep 15
            done
            if wait "$upload_pid"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "Release upload failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 20))
            echo "Release upload interrupted, retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Activate frontend release
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          ARCHIVE: ${{ steps.image.outputs.archive }}
          RELEASE_SHA: ${{ steps.image.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_opts[@]}" "$SERVER_USER@$SERVER_IP" \
            "DEPLOY_DIR='$DEPLOY_DIR' IMAGE_TAG='$IMAGE_TAG' ARCHIVE='$ARCHIVE' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="$DEPLOY_DIR/.deploy/frontend-$RELEASE_SHA"
          cd "$release_dir"
          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed on the server"; exit 1; }
          docker compose version >/dev/null
          if ! sha256sum -c "$ARCHIVE.sha256"; then
            rm -f "$ARCHIVE" .archive-sha256
            echo "Frontend archive checksum failed; the next run will upload it again"
            exit 1
          fi
          docker load -i "$ARCHIVE"

          previous_image="$(docker inspect --format '{{.Config.Image}}' bot-brief-frontend 2>/dev/null || true)"
          had_previous_compose=false
          if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
            cp -p "$DEPLOY_DIR/docker-compose.yml" "$release_dir/docker-compose.yml.previous"
            had_previous_compose=true
          fi
          install -m 644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml.new"
          mv -f "$DEPLOY_DIR/docker-compose.yml.new" "$DEPLOY_DIR/docker-compose.yml"
          cd "$DEPLOY_DIR"

          FRONTEND_IMAGE="$IMAGE_TAG" docker compose up -d --no-build --force-recreate frontend
          healthy=false
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/ >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "Frontend health check failed"
            docker logs --tail 200 bot-brief-frontend || true
            if [ "$had_previous_compose" = "true" ]; then
              install -m 644 "$release_dir/docker-compose.yml.previous" "$DEPLOY_DIR/docker-compose.yml"
            fi
            if [ -n "$previous_image" ] && docker image inspect "$previous_image" >/dev/null 2>&1; then
              echo "Rolling back to $previous_image"
              FRONTEND_IMAGE="$previous_image" docker compose up -d --no-build --force-recreate frontend
            fi
            docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true
            exit 1
          fi

          if [ -n "$previous_image" ] && [ "$previous_image" != "$IMAGE_TAG" ] && docker image inspect "$previous_image" >/dev/null 2>&1; then
            docker tag "$previous_image" bot-brief-frontend:previous
          else
            docker image rm bot-brief-frontend:previous >/dev/null 2>&1 || true
          fi
          docker tag "$IMAGE_TAG" bot-brief-frontend:local
          current_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          previous_id="$(docker image inspect --format '{{.Id}}' bot-brief-frontend:previous 2>/dev/null || true)"
          while IFS= read -r old_image; do
            [ -n "$old_image" ] || continue
            old_id="$(docker image inspect --format '{{.Id}}' "$old_image" 2>/dev/null || true)"
            if [ "$old_id" != "$current_id" ] && [ "$old_id" != "$previous_id" ]; then
              docker image rm "$old_image" >/dev/null 2>&1 || true
            fi
          done < <(docker image ls bot-brief-frontend --format '{{.Repository}}:{{.Tag}}' | grep -E '^bot-brief-frontend:[0-9a-f]{12,}$' || true)
          rm -rf "$release_dir"
          docker image prune -f
          echo "Frontend deployed successfully: $IMAGE_TAG"
          REMOTE
