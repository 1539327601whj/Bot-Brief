spring:
  application:
    name: ai-daily-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_daily}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}
          starttls:
            enable: true

  # 增加请求体大小限制（避免 400 input length too long）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    # 走 SLF4J 而不是 StdOutImpl：SQL 才会受 logging.level.com.ai.daily.mapper 控制，
    # 也能跟着时间戳/traceId 一起落盘。想看 SQL 就把 LOG_SQL_LEVEL 设为 DEBUG。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  charset:
    # 控制台编码默认跟随运行环境，不写死（这是「本地 Windows 终端 + 服务器 SSH 都要看」的前提）：
    #   本地 Windows 终端按 GBK(936) 解码 -> 用 GBK 写才不乱码
    #   容器 / 服务器 / CI      -> UTF-8
    # 取值顺序：控制台输出编码 -> 系统原生编码 -> UTF-8。
    # 注意不能拿 file.encoding 当依据：JDK 18+ 它恒为 UTF-8（JEP 400），与本机控制台无关。
    # 需要强制指定时设 LOG_CONSOLE_CHARSET。
    # 落盘固定 UTF-8（见 logback-spring.xml），不受终端影响。
    console: ${LOG_CONSOLE_CHARSET:${stdout.encoding:${sun.stdout.encoding:${native.encoding:UTF-8}}}}
    file: UTF-8
  file:
    name: ${LOG_FILE_NAME:logs/app.log}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ai.daily: ${LOG_LEVEL_APP:INFO}
    # 想排查 SQL 就设 LOG_SQL_LEVEL=DEBUG
    com.ai.daily.mapper: ${LOG_SQL_LEVEL:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.springframework.mail: WARN
    # 启动时那句 "Using generated security password: xxx" 会把一个明文凭据写进日志（还会落盘）。
    # 本项目用自建 JWT 鉴权，没开 httpBasic，这个自动配置的默认用户是惰性的，静音即可。
    # （真想彻底去掉，是排除 UserDetailsServiceAutoConfiguration，那属于行为改动，先不动。）
    org.springframework.boot.autoconfigure.security: WARN
    org.mybatis: WARN
    com.baomidou.mybatisplus: WARN
    com.zaxxer.hikari: INFO
    org.apache.hc: WARN
    org.apache.http: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: INFO
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:14}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}

server:
  port: ${SERVER_PORT:8081}
  # 增加请求头大小限制
  max-http-request-header-size: 16KB

# 允许 GitHub Actions 跨域调用（开发时放开，生产环境建议配置具体域名）
allowed-origins: ${ALLOWED_ORIGINS:*}

# DeepSeek API 配置（用于 AI 对话功能）
deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}

jwt:
  secret: ${JWT_SECRET:dev-secret-please-change-in-production-must-be-at-least-32-bytes-long}
  expiration-hours: ${JWT_EXPIRATION_HOURS:168}

admin:
  email: ${ADMIN_EMAIL:admin@example.com}
  bootstrap-password: ${ADMIN_PASSWORD:admin123456}

demo:
  enabled: ${DEMO_ENABLED:false}
  email: ${DEMO_EMAIL:demo@example.com}
  display-name: ${DEMO_DISPLAY_NAME:公开演示账号}
  token-expiration-minutes: ${DEMO_TOKEN_EXPIRATION_MINUTES:30}

report:
  ingest-token: ${REPORT_INGEST_TOKEN:}
  generation-lead-minutes: ${REPORT_GENERATION_LEAD_MINUTES:30}
  on-time-lead-minutes: ${REPORT_ON_TIME_LEAD_MINUTES:5}

mail-push:
  from-name: ${MAIL_FROM_NAME:BriefMind}

push-channel:
  encryption-key: ${PUSH_CHANNEL_ENCRYPTION_KEY:}
  http:
    connect-timeout: ${PUSH_HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${PUSH_HTTP_READ_TIMEOUT:10s}

# 「低估精选」按需筛选（规则见 automation/agents/stock_screening_rules.md）
screener:
  http:
    connect-timeout: ${SCREENER_HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${SCREENER_HTTP_READ_TIMEOUT:10s}
  # 并发抓日线的线程数，首屏时间 ≈ 请求数 / 线程数 × 单次耗时
  fetch-threads: ${SCREENER_FETCH_THREADS:5}
  # 日线取多少根（250 ≈ 一年，价格分位与 MA250 都基于它）
  kline-limit: ${SCREENER_KLINE_LIMIT:250}
  # 「代码查询」页取多少根日线（2600 ≈ 十年，5 年/10 年价格基线要它）。
  # 与上面那条分开：筛选器一天跑一次、一次要几百只，取 2600 根会白白多打十几倍流量；
  # 而查询页一次只查一只。**不要为了省一个配置项把两者合并**——
  # 合并后任何一边调参都会把另一边一起拖走。
  lookup-kline-limit: ${SCREENER_LOOKUP_KLINE_LIMIT:2600}
  # 东财被限流后，代码查询改问腾讯日线时**一次求多少根**（注意是「一次」，不是总量）。
  # **800 是实测出来的上限，不是随便挑的**（2026-10-03 实测 push2 被封、腾讯可用）：
  #   请求  250 → 250 根      请求  800 → 800 根（最早 2023-06-15）
  #   请求  900/1500/2000 → 只剩 640 根（悄悄掉进默认页，不报错）
  #   请求 2600 → {"msg":"param error","data":[]}，**硬拒**
  # 而 lookup-kline-limit 的默认值正是 2600，所以照原样传过去兜底日线会 100% 落空。
  # 上限 800 只够 3.3 年，所以引入翻页：按日期区间往回翻（end = 上一页最早 − 1 天），
  # 翻 ceil(lookup-kline-limit / 本项) 页——**总根数由 lookup-kline-limit 定，本项只管一页多宽**。
  # 默认 800 → 2600 根要 4 页，够到十年前；一次点击就是 4 次腾讯外呼，有意接受。
  # 调大它没有好处（超过 800 会被悄悄截到 640），调小只会让页数变多。
  lookup-fallback-kline-limit: ${SCREENER_LOOKUP_FALLBACK_KLINE_LIMIT:800}
  # 全市场基本面快照缓存时长
  universe-ttl-minutes: ${SCREENER_UNIVERSE_TTL_MINUTES:15}
  # 盘中（09:30–15:00）日线缓存时长；收盘后当天一直有效
  kline-intraday-ttl-minutes: ${SCREENER_KLINE_INTRADAY_TTL_MINUTES:20}
  # 指数池估值分位（PE 分位）的整块缓存时长。
  # 它是库里的数据、一天才变一次，所以不需要短；但也**不要调成一天**——
  # 用户下午点一次、16:30 同步完再点，若还看到旧数就会以为这功能根本没更新。
  # 一小时是「数几乎不变」和「用户相信它是新的」之间的折中。
  valuation-ttl-minutes: ${SCREENER_VALUATION_TTL_MINUTES:60}
  # 池子大小：取最新交易日总市值前 N 只。
  # 这是拿覆盖面换请求量的旋钮——N 越大，市值门槛越低、越不容易漏掉中盘价值股，
  # 但行情批量请求次数按 N / quote-batch-size 增长，而请求数正是触发东财限流的东西。
  # 页面会把实际市值下限写进口径摘要，调这个值时可以直接看那个数。
  # 清单接口一次能返回 2000 行，所以调到 2000 也不会多一次清单请求，只多几批行情。
  #
  # 现取 300：500 时行情要分 10 批，300 只要 3 批。代价是市值门槛抬高、会漏掉一些中盘股，
  # 页面口径摘要里的「总市值前 N 只」会跟着变成 300。这是有意的取舍——撞限流的代价
  # 比漏掉几只中盘股大。要改回去只动这个默认值，不用动代码。
  pool-size: ${SCREENER_POOL_SIZE:300}
  # 行情批量接口一次问多少只。调大能同比例减少请求次数。
  # 上限由接口实际承载决定，调大前先用 automation/scripts/verify_screener_fields.py 实测一次。
  quote-batch-size: ${SCREENER_QUOTE_BATCH_SIZE:100}
  # 被行情源限流后的冷却时长。冷却期内不再外呼，有旧快照就用旧快照并标注数据时间。
  # 冷却按源分开记（东财/腾讯/新浪各一条），所以腾讯挨限流不会连带锁掉东财的清单请求。
  rate-limit-cooldown-minutes: ${SCREENER_RATE_LIMIT_COOLDOWN_MINUTES:10}
  # 同一个源两次外呼之间的**最小间隔**（毫秒）。这是**事前**限速，与上面的冷却是配套的两件事：
  # 冷却是「被打回来之后停手」，它漏掉的是最致命的那一段——「还没被打回来，但已经在几秒内
  # 打了几十次」。一次筛选扫描约 21 次外呼（清单 1 + 行情 3 批 + 日线 16 条并发 5 线程），
  # 页面一开就跑一遍，机房 IP 的阈值远低于这个瞬时密度；等冷却触发时封禁已经开始了。
  # 150ms ≈ 单源 6-7 次/秒，比实测阈值保守一档，又不至于让首屏超出既有的 3-5 秒。
  # **置 0 即关闭**：这是回退绳，出现异常时改环境变量重启即可，不用回滚代码。
  rate-limit-min-interval-ms: ${SCREENER_RATE_LIMIT_MIN_INTERVAL_MS:150}
  # 本地排队的最长等待。超过就如实失败（本次未外呼），**不静默丢请求、也不推后别人的发车时刻**。
  # 必须小于 http.read-timeout(10s)：否则用户点一下会先卡在本地排队、再撞上读超时，两层都白花。
  rate-limit-max-wait-ms: ${SCREENER_RATE_LIMIT_MAX_WAIT_MS:8000}
  # 一次扫描里，指数池日线最多向兜底源（腾讯）实时补抓多少只。
  # 这是安全阀，不是性能旋钮：池子会扩到 200 条，而「每只一条日线」正是把 IP 封得更深的做法。
  # 额度只覆盖指数池；个股那边只数由短名单天然限住，且已经带着明确原因降级。
  # 用尽的会在口径摘要里写明少了几只。**不要因为「反正有兜底」就调大。**
  index-pool-max-live-fetches: ${SCREENER_INDEX_POOL_MAX_LIVE_FETCHES:10}
  # 筛选历史保留多少条（每次成功筛选一行，含完整结果快照，一行几十 KB）。
  # 写入时按「保留最新 N 条」裁剪，没有定时任务。表见 backend/sql/V14__screener_scan_history.sql。
  history:
    keep: ${SCREENER_HISTORY_KEEP:100}
  # 盘后预取：收盘后把「清单 + 基本面」取回落库，盘后点击就不必再向东财外呼。
  # 表见 backend/sql/V13__screener_prefetch.sql，写侧是 ScreenerPrefetchTask。
  prefetch:
    # 预取任务的总开关。关掉只影响「写」，读侧仍会去库里取已有数据。
    enabled: ${SCREENER_PREFETCH_ENABLED:true}
    # 读侧开关：盘后点击要不要吃预取库。**这是回退绳**——出现异常时置 false 重启，
    # 立刻回到「每次都实时外呼」的老行为，不用回滚代码、也不用清数据。
    read-enabled: ${SCREENER_PREFETCH_READ_ENABLED:true}
    # 主跑：交易日收盘后 30 分钟（15:00 收盘价已定，但盘后数据落定要一点时间）。
    cron: ${SCREENER_PREFETCH_CRON:0 30 15 * * MON-FRI}
    # 重试：主跑被限流或取数失败时再试几次；已经成功过的当天会被幂等闸门挡住，不产生外呼。
    retry-cron: ${SCREENER_PREFETCH_RETRY_CRON:0 0/30 16-18 * * MON-FRI}
    # 手工补跑用：置 true 时无视「今天已跑过」这道闸门。照 INDEX_POOL_FORCE 的既有做法，
    # **不提供 HTTP 触发端点**——那又要多一层鉴权，而这个入口一年也用不上几次。
    force: ${SCREENER_PREFETCH_FORCE:false}
